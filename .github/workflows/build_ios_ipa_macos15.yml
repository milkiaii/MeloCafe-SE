name: Build iOS IPA (unsigned, macos-15 runner)

# Same build as build_ios_ipa.yml but on the macos-15 runner (Xcode 26.x is installed there), used when macos-26 runners are unavailable.
# Builds MeloCafe for iPhone on a GitHub-hosted Mac and uploads an UNSIGNED .ipa as a workflow artifact.
# Sign/install it on your phone with SideStore, Sideloadly, Impactor, AltStore, etc. (no Mac needed).
#
# Run it from the "Actions" tab -> "Build iOS IPA (unsigned)" -> "Run workflow",
# or just push to the page-table-fallback branch.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Xcode build configuration"
        type: choice
        options:
          - Release
          - Debug
        default: Release
      lto:
        description: "Enable full LTO (smaller/faster app but much slower and memory hungry build; can fail on runners)"
        type: boolean
        default: false
      bundle_id:
        description: "Bundle identifier baked into the IPA (your sideload tool will usually rewrite it)"
        type: string
        default: "com.melocafe.se.MeloCafe"
  push:
    branches:
      - page-table-fallback
    paths:
      - .github/workflows/build_ios_ipa_macos15.yml

concurrency:
  group: ios-ipa-macos15-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: "${{ github.workspace }}/dependencies/vcpkg"
  VCPKG_DEFAULT_BINARY_CACHE: "${{ github.workspace }}/.vcpkg-binary-cache"
  VCPKG_DISABLE_METRICS: "1"
  CONFIGURATION: ${{ inputs.configuration || 'Release' }}
  ENABLE_LTO: ${{ inputs.lto && 'YES' || 'NO' }}
  BUNDLE_ID: ${{ inputs.bundle_id || 'com.melocafe.se.MeloCafe' }}

jobs:
  build-ipa:
    name: build-ios-ipa
    # The Xcode project needs Xcode 26 (Icon Composer .icon assets), which is installed on the macos-15 image (Xcode_26.x).
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # vcpkg needs its full history to resolve the builtin-baseline

      - name: Select Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: |
          brew update
          brew install nasm automake autoconf libtool pkgconf ninja ldid
          cmake --version

      - name: Compute vcpkg cache key
        id: vcpkg-key
        run: |
          VCPKG_HEAD="$(git -C dependencies/vcpkg rev-parse HEAD)"
          INPUTS_HASH="$(cat vcpkg.json triplets/*.cmake | shasum -a 256 | cut -c1-16)"
          OVERLAY_HASH="$(find dependencies/vcpkg_overlay_ports dependencies/vcpkg_overlay_ports_mac -type f | sort | xargs shasum -a 256 | shasum -a 256 | cut -c1-16)"
          echo "key=vcpkg-ios-${VCPKG_HEAD:0:10}-${INPUTS_HASH}-${OVERLAY_HASH}" >> "$GITHUB_OUTPUT"

      # restore + save (instead of one cache step) so a failed first build still keeps the dependencies it managed to compile
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-key.outputs.key }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.vcpkg-key.outputs.key }}-
            vcpkg-ios-

      - name: Bootstrap vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          ./dependencies/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      # vcpkg builds all third party libraries (boost, openssl, sdl3, glslang, ...) for arm64-ios during this step
      - name: Configure (CMake, Xcode generator, iOS)
        run: |
          set -o pipefail
          cmake -S . -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_HEADLESS_DYLIB=ON \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$RUNNER_TEMP/configure.log"
          # the app project references this generated project (see MeloCafe.xcodeproj -> ../build/src/cemuMain.xcodeproj)
          test -d build/src/cemuMain.xcodeproj

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-key.outputs.key }}-${{ github.run_id }}

      # ZArchive, ih264d and xbyak_aarch64 are EXCLUDE_FROM_ALL sub-projects that the app's Xcode project does not build by itself,
      # but CemuBin links their .a files from the CMake output directories, so build them first.
      - name: Build bundled static libraries
        run: |
          set -o pipefail
          cmake --build build --config "$CONFIGURATION" --target zarchive ih264d xbyak_aarch64 -- \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            LLVM_LTO="$ENABLE_LTO" 2>&1 | tee build/xcodebuild.log
          find build -name 'libzarchive.a' -o -name 'libih264d.a' -o -name 'libxbyak_aarch64.a'

      - name: Build MeloCafe.app
        run: |
          set -o pipefail
          # The app uses an iOS 27 only API (external display accessory scene). GitHub's runners only have Xcode 26 (iOS 26 SDK),
          # so compile that part out when the SDK is older than 27 (see MeloCafeApp.swift).
          SDK_MAJOR="$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)"
          SWIFT_CONDITIONS='$(inherited)'
          if [ "$SDK_MAJOR" -lt 27 ]; then
            echo "iOS SDK $SDK_MAJOR detected -> building without the iOS 27 only code (NO_IOS27_SDK)"
            SWIFT_CONDITIONS='$(inherited) NO_IOS27_SDK'
          fi
          xcodebuild \
            -project MeloCafe/MeloCafe.xcodeproj \
            -scheme MeloCafe \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            LLVM_LTO="$ENABLE_LTO" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="$SWIFT_CONDITIONS" \
            build 2>&1 | tee -a build/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP="$(find build/DerivedData/Build/Products -maxdepth 2 -name 'MeloCafe.app' -type d | head -n 1)"
          test -n "$APP" || { echo "MeloCafe.app not found"; exit 1; }
          echo "App bundle: $APP"
          ls "$APP" "$APP/Frameworks" || true

          # Embed the entitlements (increased memory limit) with a fake signature. Sideloading tools re-sign the app but
          # keep the entitlements they find, and an unsigned build would otherwise have none.
          ENTITLEMENTS="MeloCafe/MeloCafe/MeloCafe.entitlements"
          EXEC="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          ldid -S"$ENTITLEMENTS" "$EXEC" || echo "::warning::ldid could not embed entitlements; the IPA is still unsigned and installable"

          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          mkdir -p artifacts
          zip -qry "artifacts/MeloCafe-SE-unsigned.ipa" Payload
          ls -lh artifacts

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeloCafe-SE-unsigned-ipa
          path: artifacts/MeloCafe-SE-unsigned.ipa
          if-no-files-found: error

      # Puts the interesting part of the logs into check-run annotations (visible on the run summary page and via the API)
      - name: Report errors
        if: failure()
        shell: python3 {0}
        run: |
          import glob, os

          def esc(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def tail(path, lines, limit=6000):
              try:
                  with open(path, errors="replace") as f:
                      data = "".join(f.readlines()[-lines:])
              except OSError:
                  return None
              return data[-limit:]

          def report(title, path, lines=50):
              data = tail(path, lines)
              if data:
                  print(f"::error title={title}::{esc(data)}")

          temp = os.environ["RUNNER_TEMP"]
          report("CMake configure output (tail)", f"{temp}/configure.log", 60)
          report("vcpkg manifest install log (tail)", "build/vcpkg-manifest-install.log", 40)
          errlogs = sorted(glob.glob("dependencies/vcpkg/buildtrees/*/*-err.log"), key=os.path.getmtime, reverse=True)
          for path in errlogs[:3]:
              report(f"vcpkg log {os.path.relpath(path, 'dependencies/vcpkg/buildtrees')} (tail)", path, 40)
          try:
              with open("build/xcodebuild.log", errors="replace") as f:
                  hits = [l.rstrip() for l in f if "error:" in l or "error build" in l or "ld: " in l or "Undefined symbols" in l]
              if hits:
                  print(f"::error title=xcodebuild errors::{esc(chr(10).join(hits[:40])[-6000:])}")
          except OSError:
              pass
          report("xcodebuild output (tail)", "build/xcodebuild.log", 60)

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/xcodebuild.log
            ${{ runner.temp }}/configure.log
            build/vcpkg-manifest-install.log
            build/CMakeFiles/CMakeConfigureLog.yaml
            dependencies/vcpkg/buildtrees/*/*.log
          if-no-files-found: ignore
